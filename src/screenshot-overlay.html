<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Screenshot Region Selection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="screenshot-overlay/overlay.css" />
</head>
<body>
  <canvas id="screen-canvas"></canvas>

  <!-- 8 Resize handles for selection adjustment -->
  <div id="selection-box" class="selection-box hidden">
    <div class="resize-handle handle-tl" data-handle="tl"></div>
    <div class="resize-handle handle-tc" data-handle="tc"></div>
    <div class="resize-handle handle-tr" data-handle="tr"></div>
    <div class="resize-handle handle-ml" data-handle="ml"></div>
    <div class="resize-handle handle-mr" data-handle="mr"></div>
    <div class="resize-handle handle-bl" data-handle="bl"></div>
    <div class="resize-handle handle-bc" data-handle="bc"></div>
    <div class="resize-handle handle-br" data-handle="br"></div>
  </div>

  <!-- Dimension Badge -->
  <div id="dim-badge" class="dim-badge hidden"></div>

  <!-- Top Hint Bubble -->
  <div id="hint-bubble" class="hint-bubble hidden">
    <span id="hint-text">Drag to select region · Esc to cancel</span>
  </div>

  <!-- Floating Annotation Toolbar -->
  <div id="annotation-toolbar" class="annotation-toolbar hidden">
    <!-- Tool buttons -->
    <div class="tool-group">
      <button type="button" class="tool-btn" data-tool="rect" id="tool-rect" title="Rectangle">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button type="button" class="tool-btn" data-tool="circle" id="tool-circle" title="Circle">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button type="button" class="tool-btn" data-tool="arrow" id="tool-arrow" title="Arrow">
        <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5" stroke="currentColor" stroke-width="2"/><polyline points="10 5 19 5 19 14" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button type="button" class="tool-btn" data-tool="pen" id="tool-pen" title="Pen">
        <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button type="button" class="tool-btn" data-tool="mosaic" id="tool-mosaic" title="Mosaic">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="4" height="4" fill="currentColor"/>
          <rect x="11" y="3" width="4" height="4" fill="currentColor"/>
          <rect x="7" y="7" width="4" height="4" fill="currentColor"/>
          <rect x="15" y="7" width="4" height="4" fill="currentColor"/>
          <rect x="3" y="11" width="4" height="4" fill="currentColor"/>
          <rect x="11" y="11" width="4" height="4" fill="currentColor"/>
          <rect x="7" y="15" width="4" height="4" fill="currentColor"/>
          <rect x="15" y="15" width="4" height="4" fill="currentColor"/>
        </svg>
      </button>
      <button type="button" class="tool-btn" data-tool="text" id="tool-text" title="Text">
        <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="4" x2="12" y2="20" stroke="currentColor" stroke-width="2"/><line x1="9" y1="20" x2="15" y2="20" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>

    <div class="toolbar-sep"></div>

    <!-- Color Palette -->
    <div class="tool-group color-palette">
      <button type="button" class="color-dot active" data-color="#ef4444" style="background: #ef4444;"></button>
      <button type="button" class="color-dot" data-color="#eab308" style="background: #eab308;"></button>
      <button type="button" class="color-dot" data-color="#22c55e" style="background: #22c55e;"></button>
      <button type="button" class="color-dot" data-color="#3b82f6" style="background: #3b82f6;"></button>
      <button type="button" class="color-dot" data-color="#ffffff" style="background: #ffffff;"></button>
      <button type="button" class="color-dot" data-color="#18181b" style="background: #18181b; border: 1px solid rgba(255,255,255,0.4);"></button>
    </div>

    <!-- Stroke width selector -->
    <div class="tool-group stroke-selector">
      <button type="button" class="stroke-dot" data-size="2" title="Thin">
        <span class="stroke-preview" style="width: 4px; height: 4px;"></span>
      </button>
      <button type="button" class="stroke-dot active" data-size="4" title="Medium">
        <span class="stroke-preview" style="width: 8px; height: 8px;"></span>
      </button>
      <button type="button" class="stroke-dot" data-size="7" title="Thick">
        <span class="stroke-preview" style="width: 12px; height: 12px;"></span>
      </button>
    </div>

    <div class="toolbar-sep"></div>

    <!-- Undo / Redo -->
    <div class="tool-group">
      <button type="button" class="tool-btn" id="tool-undo" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button type="button" class="tool-btn" id="tool-redo" title="Redo (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>

    <div class="toolbar-sep"></div>

    <!-- Actions: Save, Copy, Cancel, Done -->
    <div class="tool-group action-group">
      <button type="button" class="tool-btn" id="tool-save" title="Save to file (Ctrl+S)">
        <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="17 21 17 13 7 13 7 21" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="7 3 7 8 15 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button type="button" class="tool-btn" id="tool-copy" title="Copy to clipboard (Ctrl+C)">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button type="button" class="tool-btn cancel-btn" id="tool-cancel" title="Cancel (Esc)">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.5"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.5"/></svg>
      </button>
      <button type="button" class="tool-btn done-btn" id="tool-done" title="Done (Enter)">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
      </button>
    </div>
  </div>

  <!-- Text Editor overlay for inline typing -->
  <div id="text-input-wrap" class="text-input-wrap hidden">
    <textarea id="annotation-textarea" rows="1" spellcheck="false"></textarea>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- Internationalization & Overlay Logic -->
  <script src="i18n.js"></script>
  <script src="screenshot-overlay/overlay.js"></script>
</body>
</html>
