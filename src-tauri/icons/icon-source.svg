<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient: Rich Dark Canvas -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d26" />
      <stop offset="52%" stop-color="#0f1219" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>

    <!-- Top highlight / glass bevel -->
    <linearGradient id="topHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="36%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient warmth near dot -->
    <radialGradient id="ambientGlow" cx="0.70" cy="0.30" r="0.45">
      <stop offset="0%" stop-color="#ff2e43" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#ff2e43" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ff2e43" stop-opacity="0" />
    </radialGradient>

    <!-- White text gradient -->
    <linearGradient id="whiteMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="95%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Red Dot Radial Gradient -->
    <radialGradient id="redDot" cx="0.36" cy="0.30" r="0.68">
      <stop offset="0%" stop-color="#ff6470" />
      <stop offset="45%" stop-color="#ff2a3b" />
      <stop offset="100%" stop-color="#cf0823" />
    </radialGradient>

    <!-- Red Dot Halo -->
    <radialGradient id="dotHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff2a3b" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#ff2a3b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff2a3b" stop-opacity="0" />
    </radialGradient>

    <!-- Letterform Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Dot Drop Shadow -->
    <filter id="dotShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#400008" flood-opacity="0.65" />
    </filter>

    <!-- macOS / iOS Standard Squircle -->
    <clipPath id="squircle">
      <path d="M 512 0
               C 904 0, 1024 120, 1024 512
               C 1024 904, 904 1024, 512 1024
               C 120 1024, 0 904, 0 512
               C 0 120, 120 0, 512 0 Z" />
    </clipPath>
  </defs>

  <!-- Squircle Base -->
  <g clip-path="url(#squircle)">
    <!-- Dark Background -->
    <rect width="1024" height="1024" fill="url(#bg)" />

    <!-- Subtle Scan Grid Texture (very faint, modern tech vibe) -->
    <g opacity="0.035" stroke="#94a3b8" stroke-width="1">
      <path d="M0 256 H1024 M0 512 H1024 M0 768 H1024 M256 0 V1024 M512 0 V1024 M768 0 V1024" />
    </g>

    <!-- Top Highlight Bevel -->
    <rect width="1024" height="1024" fill="url(#topHi)" />

    <!-- Ambient Red Halo behind dot -->
    <circle cx="719.06" cy="304.77" r="151.63" fill="url(#dotHalo)" />
    <circle cx="719.06" cy="304.77" r="244.94" fill="url(#ambientGlow)" />

    <!-- White Letterforms (P and i stem) -->
    <g filter="url(#shadow)">
      <path d="M 450.55 286.00 Q 530.78 286.00, 576.10 322.74 Q 621.51 359.48, 621.51 430.45 Q 621.51 501.42, 576.10 538.45 Q 530.78 575.48, 450.55 575.48 L 371.57 575.48 L 371.57 701.32 Q 371.57 708.16, 366.65 713.08 Q 361.74 718.00, 354.89 718.00 L 274.08 718.00 Q 267.24 718.00, 262.32 713.08 Q 257.40 708.16, 257.40 701.32 L 257.40 302.68 Q 257.40 295.84, 262.32 290.92 Q 267.24 286.00, 274.08 286.00 L 450.55 286.00 Z M 447.46 479.15 Q 474.65 479.15, 490.95 467.19 Q 507.34 455.14, 507.34 430.45 Q 507.34 405.76, 490.95 393.71 Q 474.65 381.66, 447.46 381.66 L 371.57 381.66 L 371.57 479.15 L 447.46 479.15 Z" fill="url(#whiteMark)" />
      <path d="M 774.60 701.32 Q 774.60 708.16, 769.68 713.08 Q 764.76 718.00, 757.92 718.00 L 680.20 718.00 Q 673.45 718.00, 668.43 713.08 Q 663.51 708.16, 663.51 701.32 L 663.51 413.77 Q 663.51 406.92, 668.43 402.00 Q 673.45 397.09, 680.20 397.09 L 757.92 397.09 Q 764.76 397.09, 769.68 402.00 Q 774.60 406.92, 774.60 413.77 L 774.60 701.32 Z" fill="url(#whiteMark)" />
    </g>

    <!-- Red Dot (i tittle) -->
    <circle cx="719.06" cy="304.77" r="58.32" fill="url(#redDot)" filter="url(#dotShadow)" />

    <!-- Subtle Jewel Specular Highlight on Red Dot -->
    <circle cx="702.73" cy="286.10" r="20.41" fill="#ffffff" fill-opacity="0.38" />

    <!-- Inner Border for Tactile Realism -->
    <path d="M 512 4
             C 902 4, 1020 122, 1020 512
             C 1020 902, 902 1020, 512 1020
             C 122 1020, 4 902, 4 512
             C 4 122, 122 4, 512 4 Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2.2" />
  </g>
</svg>