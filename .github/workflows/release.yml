# Release pipeline — triggered by pushing a version tag (e.g. v0.2.0).
#
# Flow:
#   1. Tag push  →  builds native installer on Windows, macOS (arm64 + x64), Linux
#   2. Uploads artefacts to a draft GitHub Release
#   3. You review the draft, then publish manually
#
# Platforms produced:
#   Windows   →  .msi + .exe (NSIS) installer
#   macOS     →  .dmg (universal via separate arm64 / x64 jobs)
#   Linux     →  .AppImage + .deb
#
# ── Prerequisites ─────────────────────────────────────────────────────────────
# 1. Push a semver tag:
#      git tag v0.2.0 && git push origin v0.2.0
#
# 2. The version in src-tauri/tauri.conf.json and src-tauri/Cargo.toml must
#    match the tag (without the leading 'v'). Update them before tagging.
#
# 3. Icons: replace src-tauri/icons/icon.png (512×512) and icon.ico before
#    cutting a real release — the current placeholders are tiny stubs.
#
# 4. Code signing (optional but recommended):
#    Windows  →  add TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#                to repo secrets, then configure windows.certificateThumbprint in
#                tauri.conf.json for Authenticode signing.
#    macOS    →  add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#                APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD,
#                APPLE_TEAM_ID for notarisation.
# ──────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v*.*.*'                      # v1.2.3
      - 'v*.*.*-*'                    # v1.2.3-beta.1
  workflow_dispatch:                    # allow manual trigger from Actions UI
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0)'
        required: true

jobs:
  build:
    name: build · ${{ matrix.label }}
    permissions:
      contents: write       # needed to create / update the GitHub Release

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ────────────────────────────────────────────────────────
          - label: windows-x64
            os: windows-latest
            args: ''

          # ── macOS ARM (Apple Silicon) ───────────────────────────────────────
          - label: macos-arm64
            os: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin

          # ── macOS Intel ─────────────────────────────────────────────────────
          - label: macos-x64
            os: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-target: x86_64-apple-darwin

          # ── Linux ──────────────────────────────────────────────────────────
          - label: linux-x64
            os: ubuntu-24.04
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── Node (Tauri CLI is an npm dev-dep) ──────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target || '' }}

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.label }}

      # ── Linux system deps ───────────────────────────────────────────────────
      - name: Install system dependencies (Linux only)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            patchelf

      # ── Node deps (Tauri CLI) ───────────────────────────────────────────────
      - name: npm ci
        run: npm ci

      # ── Build + publish ─────────────────────────────────────────────────────
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment and add secrets for code signing:
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'PiDesk ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## PiDesk ${{ inputs.tag || github.ref_name }}

            ### 📦 Installation Guide / 安装指南

            #### 🍎 macOS
            - **Homebrew (Recommended / 推荐)**:
              ```bash
              brew install --cask raiderwang/tap/pidesk
              ```
              *Automatically bypasses Gatekeeper quarantine, no extra command needed.*
            - **Manual DMG (.dmg)**:
              Download `.dmg` (`aarch64` for Apple Silicon, `x64` for Intel).
              **If macOS says "PiDesk is damaged and can't be opened"（提示已损坏）**, run this command in terminal to clear the quarantine attribute:
              ```bash
              xattr -cr /Applications/PiDesk.app
              ```

            #### 🪟 Windows
            - Download `.msi` (recommended) or `.exe` installer.
            - If Windows SmartScreen prompts on launch, click **More info → Run anyway**（点击“更多信息” → “仍要运行”）.

            #### 🐧 Linux
            - Download `.AppImage` or `.deb`.

            ---

            ### ⚙️ Requirements
            - [oh-my-pi](https://github.com/can1357/oh-my-pi) (`omp`) must be installed and available on your `PATH`.
          releaseDraft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          args: ${{ matrix.args }}

  # ── Sync Cask to raiderwang/homebrew-tap ─────────────────────────────────────
  update-cask:
    name: update · homebrew-cask
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'RaiderWang/pidesk'
    steps:
      - name: Sync Homebrew Cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning ::HOMEBREW_TAP_TOKEN secret is not set. Skipping Cask update."
            exit 0
          fi

          VERSION="${TAG#v}"
          echo "Updating Cask for PiDesk v${VERSION}..."

          ARM_URL="https://github.com/RaiderWang/pidesk/releases/download/${TAG}/PiDesk_${VERSION}_aarch64.dmg"
          X64_URL="https://github.com/RaiderWang/pidesk/releases/download/${TAG}/PiDesk_${VERSION}_x64.dmg"

          curl -sL "$ARM_URL" -o arm.dmg
          curl -sL "$X64_URL" -o x64.dmg

          SHA_ARM=$(sha256sum arm.dmg | awk '{print $1}')
          SHA_X64=$(sha256sum x64.dmg | awk '{print $1}')

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/RaiderWang/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks

          cat <<EOF > Casks/pidesk.rb
          cask "pidesk" do
            arch arm: "aarch64", intel: "x64"

            version "${VERSION}"
            sha256 arm:   "${SHA_ARM}",
                   intel: "${SHA_X64}"

            url "https://github.com/RaiderWang/pidesk/releases/download/v#{version}/PiDesk_#{version}_#{arch}.dmg"
            name "PiDesk"
            desc "GUI desktop companion for oh-my-pi (omp)"
            homepage "https://github.com/RaiderWang/pidesk"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates true

            app "PiDesk.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/PiDesk.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Application Support/com.raiderwang.pidesk",
              "~/Library/Caches/com.raiderwang.pidesk",
              "~/Library/Preferences/com.raiderwang.pidesk.plist",
              "~/Library/Saved Application State/com.raiderwang.pidesk.savedState",
            ]
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/pidesk.rb
          git commit -m "chore(pidesk): bump to v${VERSION}" || exit 0
          git push origin main

